<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="0.6" stop-color="#141416"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7c79a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="220" cy="180" r="220" fill="#e7c79a" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="1020" cy="140" r="260" fill="#ffffff" fill-opacity="0.10" filter="url(#soft)"/>

  <rect x="70" y="80" width="1060" height="470" rx="48" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="110" y="120" width="420" height="26" rx="13" fill="url(#accent)" fill-opacity="0.85"/>

  <text x="110" y="235" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI" font-size="58" font-weight="700" letter-spacing="-0.03em">BKS Kitchens &amp; Cupboards</text>
  <text x="110" y="305" fill="#f4f4f5" fill-opacity="0.75" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI" font-size="30" font-weight="500" letter-spacing="-0.01em">Premium kitchen &amp; cupboard design • Pretoria North</text>
  <text x="110" y="365" fill="#f4f4f5" fill-opacity="0.62" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI" font-size="24" font-weight="400">Design-led. Detail-obsessed. Built to last.</text>
</svg>
